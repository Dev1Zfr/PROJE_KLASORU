<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sisteme Giriş</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .error { color: red; margin-bottom: 10px; font-size: 14px; }
        .register-link { display: block; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
        .register-link:hover { text-decoration: underline; }
        .checkbox-container { display: flex; align-items: center; justify-content: flex-start; margin-top: 5px; font-size: 14px; color: #555; }
        .checkbox-container input { margin-right: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Çiftlik & Kurban Takip</h2>
        {% if hata %}
            <div class="error">{{ hata }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
            <input type="password" name="password" placeholder="Şifre" required>
            
            <!-- YENİ EKLENEN BENİ HATIRLA KUTUCUĞU -->
            <div class="checkbox-container">
                <input type="checkbox" name="hatirla" id="hatirla">
                <label for="hatirla">Beni Hatırla</label>
            </div>

            <button type="submit">Giriş Yap</button>
        </form>
        <a href="/register" class="register-link">Hesabınız yok mu? Yeni Kayıt Oluştur</a>
    </div>
</body>
</html>
