{% extends 'layout.html' %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white fw-bold fs-4">
        Yeni Hayvan Alış Ekranı
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold">Alış Türü Seçin:</label>
                <select name="kayit_turu" id="kayitTuru" class="form-select form-select-lg border-primary" onchange="turDegistir()">
                    <option value="Tekli">Tek Hayvan Ekle (Bireysel)</option>
                    <option value="Toplu">Toplu Hayvan Ekle (Grup / Sürü)</option>
                </select>
            </div>

            <!-- TEKLİ KAYIT ALANI -->
            <div id="tekliAlan" class="mb-3">
                <label class="form-label">Küpe Numarası</label>
                <input type="text" name="kupe_no" id="kupe_no" class="form-control" placeholder="Örn: TR-12345">
            </div>

            <!-- TOPLU KAYIT ALANI -->
            <div id="topluAlan" class="row g-3 mb-3" style="display: none;">
                <div class="col-md-6">
                    <label class="form-label">Grup Adı (Örn: Simental Grup 1)</label>
                    <input type="text" name="grup_adi" id="grup_adi" class="form-control" placeholder="Otomatik küpe oluşturulacak">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Kaç Adet Hayvan Alındı?</label>
                    <input type="number" name="adet" id="adet" class="form-control" value="1" min="1">
                </div>
                <small class="text-muted">* Sisteme tek tıkla belirttiğiniz sayı kadar hayvan aynı ortalama özelliklerle otomatik işlenir.</small>
            </div>

            <hr>

            <!-- ORTAK BİLGİLER -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Irk (Simental, Angus vb.)</label>
                    <input type="text" name="irk" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ortalama Alış KG</label>
                    <input type="number" step="0.1" name="alis_kg" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Adet Başı Fiyat (₺)</label>
                    <input type="number" step="1" name="alis_fiyati" class="form-control" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fs-5 fw-bold py-2">Sisteme Kaydet</button>
        </form>
    </div>
</div>

<script>
function turDegistir() {
    var tur = document.getElementById('kayitTuru').value;
    if (tur === 'Toplu') {
        document.getElementById('topluAlan').style.display = 'flex';
        document.getElementById('tekliAlan').style.display = 'none';
        document.getElementById('kupe_no').removeAttribute('required');
        document.getElementById('grup_adi').setAttribute('required', 'required');
    } else {
        document.getElementById('topluAlan').style.display = 'none';
        document.getElementById('tekliAlan').style.display = 'block';
        document.getElementById('kupe_no').setAttribute('required', 'required');
        document.getElementById('grup_adi').removeAttribute('required');
    }
}
</script>
{% endblock %}
